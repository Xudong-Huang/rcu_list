[package]
name = "rcu_list"
edition = "2021"
version = "0.1.3"
description = "a lockless concurrent list implementation"
authors = ["Xudong Huang <huangxu008@hotmail.com>"]
categories = ["concurrency", "data-structures", "no-std"]
keywords = ["rcu", "lockless", "atomic", "list"]
repository = "https://github.com/Xudong-Huang/rcu_list"
documentation = "https://docs.rs/rcu_list"
license = "MIT"
readme = "./README.md"
exclude = [".gitignore", "benches/**"]

[features]
# Enables the nightly-only `test::Bencher` micro benchmarks in benches/lib.rs,
# run them with `cargo +nightly bench --features nightly-bench`.
nightly-bench = []

[dependencies]
rcu_cell = "1.2.5"
crossbeam-utils = "0.8.20"

[dev-dependencies]
scc = "3.8.8"
seize = "0.5.1"
criterion = "0.8"
parking_lot = "0.13"
crossbeam-epoch = "0.9.8"
crossbeam-queue = "0.3.11"

[[bench]]
name = "lib"
required-features = ["nightly-bench"]

[[bench]]
name = "stack"
harness = false

[[bench]]
name = "queue"
harness = false
